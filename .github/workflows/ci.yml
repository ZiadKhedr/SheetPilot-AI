name: SheetPilot validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: python -m pip install -e ".[app,dev]"
      - run: python -m pytest -q
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend e2e
        env:
          SHEETPILOT_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: frontend/playwright-report/
# Real Meta tests are opt-in locally. No API key is embedded in workflow or source.
