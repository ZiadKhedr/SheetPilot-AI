[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-intelligence"
version = "0.2.0"
description = "Read-only structural analysis for unfamiliar Excel workbooks"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "pydantic>=2,<3", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
app = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2", "pandas>=2.2,<3"]

[project.scripts]
excel-analyze = "excel_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
