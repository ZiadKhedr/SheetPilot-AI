services:
  sheetpilot:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
      SHEETPILOT_DATA_DIR: /app/.data
      SHEETPILOT_ACCESS_TOKEN: ${SHEETPILOT_ACCESS_TOKEN:-}
      SHEETPILOT_READ_TOKEN: ${SHEETPILOT_READ_TOKEN:-}
    volumes:
      - sheetpilot-data:/app/.data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  sheetpilot-data:
